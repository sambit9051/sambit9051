<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DWG/DXF to PDF Plotter - Batch Converter</title>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.3.1/dist/dxf-parser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-dxf@3.3.2/dist/three-dxf.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --secondary: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --dark: #1f2937;
      --darker: #111827;
      --light: #f9fafb;
      --border: #e5e7eb;
      --text: #374151;
      --text-light: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 30px 40px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.95;
    }

    .content {
      padding: 40px;
    }

    .upload-zone {
      border: 3px dashed var(--border);
      border-radius: 15px;
      padding: 60px 40px;
      text-align: center;
      background: var(--light);
      transition: all 0.3s ease;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
      transform: scale(1.02);
    }

    .upload-zone.dragover {
      background: #dbeafe;
    }

    .upload-icon {
      font-size: 4rem;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .upload-zone h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--dark);
    }

    .upload-zone p {
      color: var(--text-light);
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: var(--secondary);
      color: white;
    }

    .btn-secondary:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .settings-panel {
      background: var(--light);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .settings-panel h3 {
      margin-bottom: 20px;
      color: var(--dark);
      font-size: 1.3rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--dark);
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group select {
      padding: 10px 15px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .file-list {
      margin: 30px 0;
    }

    .file-list h3 {
      margin-bottom: 20px;
      color: var(--dark);
      font-size: 1.3rem;
    }

    .file-item {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: all 0.3s ease;
    }

    .file-item:hover {
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .file-icon {
      font-size: 2.5rem;
      color: var(--primary);
      min-width: 60px;
      text-align: center;
    }

    .file-info {
      flex: 1;
    }

    .file-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--dark);
      margin-bottom: 5px;
    }

    .file-meta {
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .file-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .status-pending { color: var(--text-light); }
    .status-processing { color: var(--warning); }
    .status-success { color: var(--secondary); }
    .status-error { color: var(--danger); }

    .progress-bar {
      width: 200px;
      height: 8px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    .file-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .preview-btn {
      background: #f3f4f6;
      color: var(--text);
    }

    .preview-btn:hover {
      background: #e5e7eb;
    }

    .download-btn {
      background: var(--secondary);
      color: white;
    }

    .download-btn:hover {
      background: #059669;
    }

    .remove-btn {
      background: var(--danger);
      color: white;
    }

    .remove-btn:hover {
      background: #dc2626;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .canvas-container {
      display: none;
      margin-top: 30px;
      background: var(--darker);
      border-radius: 15px;
      padding: 20px;
    }

    #previewCanvas {
      width: 100%;
      max-width: 100%;
      border-radius: 10px;
      background: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .alert {
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }

    .alert-info {
      background: #dbeafe;
      color: #1e40af;
      border-left: 4px solid var(--primary);
    }

    .alert-warning {
      background: #fef3c7;
      color: #92400e;
      border-left: 4px solid var(--warning);
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border-left: 4px solid var(--secondary);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .content {
        padding: 20px;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }

      .file-item {
        flex-direction: column;
        text-align: center;
      }

      .action-buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📐 DWG/DXF to PDF Plotter</h1>
      <p>Convert multiple CAD files to high-quality PDF documents</p>
    </div>

    <div class="content">
      <!-- Statistics -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="totalFiles">0</div>
          <div class="stat-label">Total Files</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="processedFiles">0</div>
          <div class="stat-label">Processed</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="successFiles">0</div>
          <div class="stat-label">Successful</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="failedFiles">0</div>
          <div class="stat-label">Failed</div>
        </div>
      </div>

      <!-- Upload Zone -->
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📁</div>
        <h3>Drop DWG/DXF files here or click to browse</h3>
        <p>Supports multiple file selection • .dwg and .dxf formats</p>
        <button class="btn btn-primary">
          <span>📂</span>
          Select Files
        </button>
        <input type="file" id="fileInput" accept=".dxf,.dwg" multiple style="display: none;">
      </div>

      <!-- Settings Panel -->
      <div class="settings-panel">
        <h3>⚙️ Conversion Settings</h3>
        <div class="settings-grid">
          <div class="form-group">
            <label for="pageSize">Page Size</label>
            <select id="pageSize">
              <option value="a4">A4 (210 × 297 mm)</option>
              <option value="a3">A3 (297 × 420 mm)</option>
              <option value="a2">A2 (420 × 594 mm)</option>
              <option value="a1">A1 (594 × 841 mm)</option>
              <option value="a0">A0 (841 × 1189 mm)</option>
              <option value="letter">Letter (8.5 × 11 in)</option>
              <option value="legal">Legal (8.5 × 14 in)</option>
              <option value="tabloid">Tabloid (11 × 17 in)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="orientation">Orientation</label>
            <select id="orientation">
              <option value="landscape">Landscape</option>
              <option value="portrait">Portrait</option>
            </select>
          </div>

          <div class="form-group">
            <label for="scale">Scale</label>
            <select id="scale">
              <option value="auto">Auto-fit</option>
              <option value="1:1">1:1</option>
              <option value="1:2">1:2</option>
              <option value="1:5">1:5</option>
              <option value="1:10">1:10</option>
              <option value="1:20">1:20</option>
              <option value="1:50">1:50</option>
              <option value="1:100">1:100</option>
              <option value="1:200">1:200</option>
            </select>
          </div>

          <div class="form-group">
            <label for="lineWidth">Line Width (mm)</label>
            <input type="number" id="lineWidth" min="0.1" max="5" step="0.1" value="0.5">
          </div>

          <div class="form-group">
            <label for="colorMode">Color Mode</label>
            <select id="colorMode">
              <option value="color">Full Color</option>
              <option value="grayscale">Grayscale</option>
              <option value="monochrome">Monochrome</option>
            </select>
          </div>

          <div class="form-group">
            <label for="dpi">Resolution (DPI)</label>
            <select id="dpi">
              <option value="72">72 DPI (Screen)</option>
              <option value="150">150 DPI (Draft)</option>
              <option value="300" selected>300 DPI (Standard)</option>
              <option value="600">600 DPI (High Quality)</option>
              <option value="1200">1200 DPI (Print)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- File List -->
      <div class="file-list" id="fileListContainer" style="display: none;">
        <h3>📋 Files Queue</h3>
        <div id="fileList"></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons" id="actionButtons" style="display: none;">
        <button class="btn btn-secondary" id="convertAllBtn">
          <span>🔄</span>
          Convert All to PDF
        </button>
        <button class="btn btn-secondary" id="downloadAllBtn" style="display: none;">
          <span>⬇️</span>
          Download All PDFs
        </button>
        <button class="btn btn-danger" id="clearAllBtn">
          <span>🗑️</span>
          Clear All
        </button>
      </div>

      <!-- Preview Canvas -->
      <div class="canvas-container" id="canvasContainer">
        <h3 style="color: white; margin-bottom: 15px;">Preview</h3>
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // File management
    let files = [];
    let processedPDFs = [];

    // DOM Elements
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const fileListContainer = document.getElementById('fileListContainer');
    const actionButtons = document.getElementById('actionButtons');
    const convertAllBtn = document.getElementById('convertAllBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const previewCanvas = document.getElementById('previewCanvas');
    const canvasContainer = document.getElementById('canvasContainer');

    // Stats
    const totalFilesEl = document.getElementById('totalFiles');
    const processedFilesEl = document.getElementById('processedFiles');
    const successFilesEl = document.getElementById('successFiles');
    const failedFilesEl = document.getElementById('failedFiles');

    // Settings
    const pageSize = document.getElementById('pageSize');
    const orientation = document.getElementById('orientation');
    const scale = document.getElementById('scale');
    const lineWidth = document.getElementById('lineWidth');
    const colorMode = document.getElementById('colorMode');
    const dpi = document.getElementById('dpi');

    // Page dimensions in mm
    const pageSizes = {
      a4: { width: 210, height: 297 },
      a3: { width: 297, height: 420 },
      a2: { width: 420, height: 594 },
      a1: { width: 594, height: 841 },
      a0: { width: 841, height: 1189 },
      letter: { width: 215.9, height: 279.4 },
      legal: { width: 215.9, height: 355.6 },
      tabloid: { width: 279.4, height: 431.8 }
    };

    // Event Listeners
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', handleDragOver);
    uploadZone.addEventListener('dragleave', handleDragLeave);
    uploadZone.addEventListener('drop', handleDrop);
    fileInput.addEventListener('change', handleFileSelect);
    convertAllBtn.addEventListener('click', convertAllFiles);
    downloadAllBtn.addEventListener('click', downloadAllPDFs);
    clearAllBtn.addEventListener('click', clearAllFiles);

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      uploadZone.classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      uploadZone.classList.remove('dragover');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      uploadZone.classList.remove('dragover');

      const droppedFiles = Array.from(e.dataTransfer.files);
      addFiles(droppedFiles);
    }

    function handleFileSelect(e) {
      const selectedFiles = Array.from(e.target.files);
      addFiles(selectedFiles);
    }

    function addFiles(newFiles) {
      const validFiles = newFiles.filter(file => {
        const ext = file.name.toLowerCase().split('.').pop();
        return ext === 'dxf' || ext === 'dwg';
      });

      if (validFiles.length === 0) {
        alert('Please select valid DXF or DWG files.');
        return;
      }

      validFiles.forEach(file => {
        const fileObj = {
          id: Date.now() + Math.random(),
          file: file,
          name: file.name,
          size: file.size,
          type: file.name.toLowerCase().endsWith('.dxf') ? 'DXF' : 'DWG',
          status: 'pending',
          progress: 0,
          pdfBlob: null,
          error: null
        };
        files.push(fileObj);
      });

      updateUI();
    }

    function updateUI() {
      // Update stats
      totalFilesEl.textContent = files.length;
      const processed = files.filter(f => f.status === 'success' || f.status === 'error').length;
      const success = files.filter(f => f.status === 'success').length;
      const failed = files.filter(f => f.status === 'error').length;

      processedFilesEl.textContent = processed;
      successFilesEl.textContent = success;
      failedFilesEl.textContent = failed;

      // Update file list
      if (files.length > 0) {
        fileListContainer.style.display = 'block';
        actionButtons.style.display = 'flex';

        fileList.innerHTML = files.map(file => `
          <div class="file-item" data-id="${file.id}">
            <div class="file-icon">
              ${file.type === 'DXF' ? '📄' : '📐'}
            </div>
            <div class="file-info">
              <div class="file-name">${file.name}</div>
              <div class="file-meta">
                ${formatFileSize(file.size)} • ${file.type} File
              </div>
            </div>
            <div class="file-status status-${file.status}">
              ${getStatusIcon(file.status)} ${file.status.toUpperCase()}
              ${file.status === 'processing' ? '<div class="spinner"></div>' : ''}
            </div>
            ${file.status === 'processing' ? `
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${file.progress}%"></div>
              </div>
            ` : ''}
            <div class="file-actions">
              ${file.status === 'success' ? `
                <button class="action-btn download-btn" onclick="downloadPDF('${file.id}')">
                  ⬇️ Download
                </button>
              ` : ''}
              ${file.status === 'pending' ? `
                <button class="action-btn preview-btn" onclick="convertSingleFile('${file.id}')">
                  🔄 Convert
                </button>
              ` : ''}
              <button class="action-btn remove-btn" onclick="removeFile('${file.id}')">
                🗑️
              </button>
            </div>
          </div>
        `).join('');
      } else {
        fileListContainer.style.display = 'none';
        actionButtons.style.display = 'none';
      }

      // Show download all button if there are successful conversions
      if (success > 0) {
        downloadAllBtn.style.display = 'inline-flex';
      } else {
        downloadAllBtn.style.display = 'none';
      }
    }

    function getStatusIcon(status) {
      const icons = {
        pending: '⏳',
        processing: '⚙️',
        success: '✅',
        error: '❌'
      };
      return icons[status] || '❓';
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    window.removeFile = function(id) {
      files = files.filter(f => f.id != id);
      updateUI();
    }

    function clearAllFiles() {
      if (confirm('Are you sure you want to clear all files?')) {
        files = [];
        processedPDFs = [];
        updateUI();
      }
    }

    async function convertAllFiles() {
      const pendingFiles = files.filter(f => f.status === 'pending');

      if (pendingFiles.length === 0) {
        alert('No pending files to convert.');
        return;
      }

      convertAllBtn.disabled = true;

      for (const file of pendingFiles) {
        await convertFile(file);
      }

      convertAllBtn.disabled = false;
      alert(`Conversion complete!\nSuccess: ${files.filter(f => f.status === 'success').length}\nFailed: ${files.filter(f => f.status === 'error').length}`);
    }

    window.convertSingleFile = async function(id) {
      const file = files.find(f => f.id == id);
      if (file) {
        await convertFile(file);
      }
    }

    async function convertFile(fileObj) {
      fileObj.status = 'processing';
      fileObj.progress = 0;
      updateUI();

      try {
        // Read file
        const fileContent = await readFileAsText(fileObj.file);

        fileObj.progress = 30;
        updateUI();

        // Parse DXF (only DXF is supported by dxf-parser in browser)
        if (fileObj.type === 'DWG') {
          throw new Error('DWG format requires server-side conversion. Please use DXF format or convert DWG to DXF first.');
        }

        const parser = new window.DxfParser();
        const dxf = parser.parseSync(fileContent);

        fileObj.progress = 60;
        updateUI();

        // Convert to PDF
        const pdfBlob = await dxfToPDF(dxf, fileObj.name);

        fileObj.progress = 100;
        fileObj.status = 'success';
        fileObj.pdfBlob = pdfBlob;

      } catch (error) {
        console.error('Conversion error:', error);
        fileObj.status = 'error';
        fileObj.error = error.message;
      }

      updateUI();
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (e) => reject(e);
        reader.readAsText(file);
      });
    }

    async function dxfToPDF(dxf, filename) {
      const { jsPDF } = window.jspdf;

      // Get page settings
      const pageFormat = pageSize.value;
      const orient = orientation.value;
      const pageDims = pageSizes[pageFormat];

      // Create PDF
      const pdf = new jsPDF({
        orientation: orient,
        unit: 'mm',
        format: pageFormat
      });

      const pageWidth = orient === 'landscape' ? pageDims.height : pageDims.width;
      const pageHeight = orient === 'landscape' ? pageDims.width : pageDims.height;

      // Calculate bounds
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

      if (dxf.entities) {
        dxf.entities.forEach(entity => {
          if (entity.type === 'LINE') {
            minX = Math.min(minX, entity.vertices[0].x, entity.vertices[1].x);
            minY = Math.min(minY, entity.vertices[0].y, entity.vertices[1].y);
            maxX = Math.max(maxX, entity.vertices[0].x, entity.vertices[1].x);
            maxY = Math.max(maxY, entity.vertices[0].y, entity.vertices[1].y);
          } else if (entity.type === 'POLYLINE' || entity.type === 'LWPOLYLINE') {
            entity.vertices.forEach(v => {
              minX = Math.min(minX, v.x);
              minY = Math.min(minY, v.y);
              maxX = Math.max(maxX, v.x);
              maxY = Math.max(maxY, v.y);
            });
          } else if (entity.type === 'CIRCLE') {
            minX = Math.min(minX, entity.center.x - entity.radius);
            minY = Math.min(minY, entity.center.y - entity.radius);
            maxX = Math.max(maxX, entity.center.x + entity.radius);
            maxY = Math.max(maxY, entity.center.y + entity.radius);
          } else if (entity.type === 'ARC') {
            minX = Math.min(minX, entity.center.x - entity.radius);
            minY = Math.min(minY, entity.center.y - entity.radius);
            maxX = Math.max(maxX, entity.center.x + entity.radius);
            maxY = Math.max(maxY, entity.center.y + entity.radius);
          }
        });
      }

      const drawingWidth = maxX - minX;
      const drawingHeight = maxY - minY;

      // Calculate scale
      let scaleVal;
      if (scale.value === 'auto') {
        const scaleX = (pageWidth - 20) / drawingWidth;
        const scaleY = (pageHeight - 20) / drawingHeight;
        scaleVal = Math.min(scaleX, scaleY);
      } else {
        const ratio = parseFloat(scale.value.split(':')[1]) / parseFloat(scale.value.split(':')[0]);
        scaleVal = ratio;
      }

      const offsetX = (pageWidth - drawingWidth * scaleVal) / 2 - minX * scaleVal;
      const offsetY = (pageHeight - drawingHeight * scaleVal) / 2 - minY * scaleVal;

      // Set line width
      const lineW = parseFloat(lineWidth.value);
      pdf.setLineWidth(lineW);

      // Draw entities
      if (dxf.entities) {
        dxf.entities.forEach(entity => {
          // Set color
          let color = '#000000';
          if (colorMode.value === 'color' && entity.color) {
            color = getColorFromACI(entity.color);
          } else if (colorMode.value === 'grayscale') {
            color = '#666666';
          }
          pdf.setDrawColor(color);

          if (entity.type === 'LINE') {
            const x1 = entity.vertices[0].x * scaleVal + offsetX;
            const y1 = pageHeight - (entity.vertices[0].y * scaleVal + offsetY);
            const x2 = entity.vertices[1].x * scaleVal + offsetX;
            const y2 = pageHeight - (entity.vertices[1].y * scaleVal + offsetY);
            pdf.line(x1, y1, x2, y2);
          } else if (entity.type === 'POLYLINE' || entity.type === 'LWPOLYLINE') {
            for (let i = 0; i < entity.vertices.length - 1; i++) {
              const x1 = entity.vertices[i].x * scaleVal + offsetX;
              const y1 = pageHeight - (entity.vertices[i].y * scaleVal + offsetY);
              const x2 = entity.vertices[i + 1].x * scaleVal + offsetX;
              const y2 = pageHeight - (entity.vertices[i + 1].y * scaleVal + offsetY);
              pdf.line(x1, y1, x2, y2);
            }
          } else if (entity.type === 'CIRCLE') {
            const cx = entity.center.x * scaleVal + offsetX;
            const cy = pageHeight - (entity.center.y * scaleVal + offsetY);
            const r = entity.radius * scaleVal;
            pdf.circle(cx, cy, r);
          } else if (entity.type === 'ARC') {
            const cx = entity.center.x * scaleVal + offsetX;
            const cy = pageHeight - (entity.center.y * scaleVal + offsetY);
            const r = entity.radius * scaleVal;
            const startAngle = entity.startAngle * 180 / Math.PI;
            const endAngle = entity.endAngle * 180 / Math.PI;

            // Draw arc as series of lines
            const segments = 32;
            const angleStep = (endAngle - startAngle) / segments;
            for (let i = 0; i < segments; i++) {
              const a1 = (startAngle + i * angleStep) * Math.PI / 180;
              const a2 = (startAngle + (i + 1) * angleStep) * Math.PI / 180;
              const x1 = cx + r * Math.cos(a1);
              const y1 = cy - r * Math.sin(a1);
              const x2 = cx + r * Math.cos(a2);
              const y2 = cy - r * Math.sin(a2);
              pdf.line(x1, y1, x2, y2);
            }
          }
        });
      }

      // Add metadata
      pdf.setProperties({
        title: filename,
        subject: 'DXF to PDF Conversion',
        creator: 'DWG/DXF to PDF Plotter',
        keywords: 'CAD, DXF, PDF'
      });

      return pdf.output('blob');
    }

    function getColorFromACI(aciColor) {
      // AutoCAD Color Index to RGB (simplified)
      const colors = {
        1: '#FF0000', 2: '#FFFF00', 3: '#00FF00', 4: '#00FFFF', 5: '#0000FF',
        6: '#FF00FF', 7: '#000000', 8: '#808080', 9: '#C0C0C0'
      };
      return colors[aciColor] || '#000000';
    }

    window.downloadPDF = function(id) {
      const file = files.find(f => f.id == id);
      if (file && file.pdfBlob) {
        const url = URL.createObjectURL(file.pdfBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name.replace(/\.(dxf|dwg)$/i, '.pdf');
        a.click();
        URL.revokeObjectURL(url);
      }
    }

    function downloadAllPDFs() {
      const successFiles = files.filter(f => f.status === 'success');

      if (successFiles.length === 0) {
        alert('No converted PDFs available for download.');
        return;
      }

      successFiles.forEach(file => {
        setTimeout(() => downloadPDF(file.id), 100);
      });
    }

    // Initialize
    console.log('DWG/DXF to PDF Plotter initialized');
    console.log('Note: DWG format requires conversion to DXF first. Use DXF files for best results.');
  </script>
